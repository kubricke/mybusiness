name: monitor-calendario

on:
  schedule:
    - cron: "*/5 * * * *"    # ogni 5 minuti
  workflow_dispatch:          # permette l'avvio manuale
    inputs:
      test:
        description: "Invia solo un messaggio di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write             # serve per salvare state.json

concurrency: monitor

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Controlla calendario
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
          TEST_NOTIFICA: ${{ inputs.test && '1' || '' }}

      - name: Salva stato
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "aggiorna stato" && git push)
